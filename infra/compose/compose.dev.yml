# sbc-noc dev stack on sbc-ubuntu (M02). Run from the repository root:
#   docker compose --env-file /opt/sbc-noc/dev.env -f infra/compose/compose.dev.yml up -d --build
# Env template: infra/compose/dev.env.example (real file lives outside the repo, chmod 600 — ADR-0005).
name: sbc-noc-dev

# Service names are prefixed (noc-dev-*) because api/worker join the shared network
# used by other systems; a plain `api` alias could collide with theirs.

x-node-env: &node-env
  NODE_ENV: production
  DATABASE_URL: postgres://sbc_noc:${POSTGRES_PASSWORD}@noc-dev-db:5432/sbc_noc
  REDIS_URL: ${REDIS_URL:?set REDIS_URL in the env file}
  REDIS_PREFIX: ${REDIS_PREFIX:-noc:dev:}

services:
  noc-dev-db:
    image: postgres:16-alpine # design v1.2 targets PostgreSQL 16
    container_name: sbc-noc-dev-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: sbc_noc
      POSTGRES_USER: sbc_noc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the env file}
      TZ: UTC
    volumes:
      - db-data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sbc_noc -d sbc_noc']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { cpus: '1', memory: 512M }

  # One-shot: applies packages/db/migrations before api/worker start (M03).
  noc-dev-migrate:
    image: sbc-noc-api:dev # built by noc-dev-api; never pulled
    pull_policy: never
    container_name: sbc-noc-dev-migrate
    command: ['node', 'node_modules/@sbc-noc/db/dist/migrate-cli.js']
    environment: *node-env
    depends_on:
      noc-dev-db: { condition: service_healthy }
    networks: [internal]
    restart: 'no'

  noc-dev-api:
    build: { context: ../.., dockerfile: apps/api/Dockerfile }
    image: sbc-noc-api:dev
    container_name: sbc-noc-dev-api
    restart: unless-stopped
    environment:
      <<: *node-env
      # Demo scenarios at /api/demo/* (M38, ADR-0014) — dev only; prod leaves it false.
      DEMO_MODE: ${DEMO_MODE:-true}
    depends_on:
      noc-dev-migrate: { condition: service_completed_successfully }
    networks: [internal, shared]
    deploy:
      resources:
        limits: { cpus: '1', memory: 512M }

  noc-dev-worker:
    build: { context: ../.., dockerfile: apps/worker/Dockerfile }
    image: sbc-noc-worker:dev
    container_name: sbc-noc-dev-worker
    restart: unless-stopped
    environment:
      <<: *node-env
      # Read-only Zabbix API user noc-api-read (M12); worker only, not the api.
      ZABBIX_URL: ${ZABBIX_URL:-}
      ZABBIX_TOKEN_READ: ${ZABBIX_TOKEN_READ:-}
      # Write user noc-api-sync (ADR-0019); dev can only write group 99-NOC-Test (ADR-0013).
      ZABBIX_TOKEN_SYNC: ${ZABBIX_TOKEN_SYNC:-}
      ZABBIX_TAG_GROUPS: ${ZABBIX_TAG_GROUPS:-99-NOC-Test}
      # UniFi controller, View Only user (M06). UNIFI_SITE is the internal site name, not "Default".
      UNIFI_URL: ${UNIFI_URL:-}
      UNIFI_USERNAME: ${UNIFI_USERNAME:-}
      UNIFI_PASSWORD: ${UNIFI_PASSWORD:-}
      UNIFI_SITE: ${UNIFI_SITE:-default}
      # Registry code of the controller (ctl-unifi now; udm after the move to the UDM Pro Max).
      UNIFI_CONTROLLER_CODE: ${UNIFI_CONTROLLER_CODE:-}
      # Pinned controller certificate inside /run/noc-certs (mounted read-only below).
      UNIFI_CA_FILE: ${UNIFI_CA_FILE:-}
      UNIFI_TLS_INSECURE: ${UNIFI_TLS_INSECURE:-false}
      # Omada controller, Open API app sbc-noc-read (Client mode, Viewer) — M06
      OMADA_URL: ${OMADA_URL:-}
      OMADA_ID: ${OMADA_ID:-}
      OMADA_CLIENT_ID: ${OMADA_CLIENT_ID:-}
      OMADA_CLIENT_SECRET: ${OMADA_CLIENT_SECRET:-}
      OMADA_SITE: ${OMADA_SITE:-}
      OMADA_CA_FILE: ${OMADA_CA_FILE:-}
      OMADA_TLS_INSECURE: ${OMADA_TLS_INSECURE:-false}
      OMADA_CONTROLLER_CODE: ${OMADA_CONTROLLER_CODE:-}
      # SBC ASSET published CSV (tab NOC_LOC_Export, M05)
      SBC_ASSET_CSV_URL: ${SBC_ASSET_CSV_URL:-}
    volumes:
      - ${NOC_CERTS_DIR:-/opt/sbc-noc/certs}:/run/noc-certs:ro
    depends_on:
      noc-dev-migrate: { condition: service_completed_successfully }
    networks: [internal, shared]
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 256M }

  noc-dev-web:
    build: { context: ../.., dockerfile: apps/web/Dockerfile }
    image: sbc-noc-web:dev
    container_name: sbc-noc-dev-web
    restart: unless-stopped
    depends_on: [noc-dev-api]
    environment:
      API_UPSTREAM: http://noc-dev-api:3001
    # No published port: reachable only through Nginx Proxy Manager on the proxy network,
    # so the NPM access list cannot be bypassed via http://<host>:<port> (baseline §8, M17).
    networks: [internal, proxy]
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 128M }

networks:
  internal:
    name: sbc-noc-dev-internal
  # Existing network that sbc-redis is attached to (Redis only listens on 127.0.0.1 on the host).
  shared:
    external: true
    name: ${SBC_SHARED_NETWORK:?set SBC_SHARED_NETWORK in the env file}
  # Existing network that sbc-npm is attached to; NPM forwards noc-dev.sbc.lan to sbc-noc-dev-web:80.
  proxy:
    external: true
    name: ${SBC_PROXY_NETWORK:?set SBC_PROXY_NETWORK in the env file}

volumes:
  db-data:
    name: sbc-noc-dev-db16-data
