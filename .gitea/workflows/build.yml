# Heavy jobs only on PRs into main and release tags (ADR-0007).
name: build

on:
  pull_request:
    branches: [main]
  push:
    tags: ['v*']

concurrency:
  group: build-${{ gitea.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    container:
      image: node:24-bookworm
      options: --cpus=2 --memory=3g
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Enable pnpm (corepack)
        run: corepack enable

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      # --- Placeholders for later modules -------------------------------------
      # M17: build and push images to git.sbc.lan (tag = version + git sha),
      #      Trivy image scan (fail on HIGH/CRITICAL) and SBOM (syft/CycloneDX).
      # M22: Playwright e2e against the staging stack (noc-dev.sbc.lan).

  db-integration:
    name: db-integration
    runs-on: ubuntu-latest
    container:
      image: node:24-bookworm
      options: --cpus=1 --memory=2g
    # Real PostgreSQL 16 instead of Testcontainers: job containers have no Docker socket (ADR-0018).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: noc
          POSTGRES_PASSWORD: noc-ci-only
          POSTGRES_DB: sbc_noc_test
      redis:
        image: redis:7-alpine
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Enable pnpm (corepack)
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            node -e "const s=require('net').connect(5432,'postgres');s.on('connect',()=>process.exit(0));s.on('error',()=>process.exit(1))" && exit 0
            sleep 2
          done
          echo "postgres did not start"; exit 1

      - name: Migrations, schema, seed and worker tests on PostgreSQL 16 + Redis
        env:
          TEST_DATABASE_URL: postgres://noc:noc-ci-only@postgres:5432/sbc_noc_test
          TEST_REDIS_URL: redis://redis:6379/0
        run: pnpm turbo run test --filter=@sbc-noc/db --filter=@sbc-noc/worker
