<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SB School · ผังเครือข่าย 3 มิติ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c1522; --ground:#101d2e; --grid:#1b2c43; --slab:#1d3048; --edge:#5f86ad;
  --ink:#e6eef7; --ink-2:#9db0c6; --panel:rgba(14,24,38,.9); --line:#27405e;
  --core:#f2c14e; --main:#47d6a4; --access:#6fb6ff; --lab:#b9a7ff; --nvr:#ef7fc4;
  --wan:#58c8f0; --ap:#c6e86b; --planned:#7d8ca0; --down:#ff5b6b; --muted:#4a5a6e;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#e9eef4; --ground:#f3f6fa; --grid:#d6dfe9; --slab:#dfe8f2; --edge:#6a88a8;
    --ink:#132235; --ink-2:#4d6178; --panel:rgba(255,255,255,.93); --line:#c9d5e2;
    --core:#c98f10; --main:#139a6e; --access:#2f7fd6; --lab:#6c55d9; --nvr:#c43f8f;
    --wan:#1c8fbf; --ap:#6f8f12; --planned:#8b98a8; --down:#e0263a; --muted:#aab6c4;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1522; --ground:#101d2e; --grid:#1b2c43; --slab:#1d3048; --edge:#5f86ad;
  --ink:#e6eef7; --ink-2:#9db0c6; --panel:rgba(14,24,38,.9); --line:#27405e;
  --core:#f2c14e; --main:#47d6a4; --access:#6fb6ff; --lab:#b9a7ff; --nvr:#ef7fc4;
  --wan:#58c8f0; --ap:#c6e86b; --planned:#7d8ca0; --down:#ff5b6b; --muted:#4a5a6e;
}
:root[data-theme="light"]{
  --bg:#e9eef4; --ground:#f3f6fa; --grid:#d6dfe9; --slab:#dfe8f2; --edge:#6a88a8;
  --ink:#132235; --ink-2:#4d6178; --panel:rgba(255,255,255,.93); --line:#c9d5e2;
  --core:#c98f10; --main:#139a6e; --access:#2f7fd6; --lab:#6c55d9; --nvr:#c43f8f;
  --wan:#1c8fbf; --ap:#6f8f12; --planned:#8b98a8; --down:#e0263a; --muted:#aab6c4;
}
:root{--warn:#ffc23d; font-size:clamp(13px, 0.3vw + 9.5px, 16px)}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){--warn:#b7791f} }
:root[data-theme="dark"]{--warn:#ffc23d}
:root[data-theme="light"]{--warn:#b7791f}
:root.tv{font-size:clamp(16px, 0.45vw + 9px, 22px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);overflow:hidden;font-family:"IBM Plex Sans Thai",Tahoma,"Leelawadee UI",sans-serif;
  font-size:1rem;line-height:1.45;font-variant-numeric:tabular-nums}
#app{position:relative;height:100%}
canvas{display:block;touch-action:none}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.blabel{position:absolute;transform:translate(-50%,-100%);white-space:nowrap;font-weight:600;font-size:.85rem;line-height:1.4;
  padding:.05rem .5rem;border-radius:.3rem;background:var(--panel);border:1px solid var(--line);color:var(--ink)}
.blabel small{font-weight:400;color:var(--ink-2);margin-left:.3rem}
.blabel.dim{opacity:.25}
.badge{position:absolute;transform:translate(-50%,-100%);white-space:nowrap;font-size:.8rem;line-height:1.4;font-weight:600;padding:0 .45rem;border-radius:1rem;
  pointer-events:auto;cursor:pointer;background:var(--panel);border:1px solid currentColor}
.badge.down{color:var(--down)} .badge.warn{color:var(--warn)}
.ring{display:inline-block;width:.6rem;height:.6rem;border-radius:50%;border:2px solid var(--main);margin-right:.4rem;vertical-align:.05rem;box-sizing:border-box}
.ring.warn{border-color:var(--warn);background:var(--warn)}
.ring.down{border-color:var(--down);background:var(--down);animation:ringp 1.1s ease-in-out infinite}
.ring.maint{border-color:var(--planned)}
@keyframes ringp{50%{box-shadow:0 0 0 .3rem color-mix(in srgb,var(--down) 25%,transparent)}}

/* ปุ่ม ชิป ช่องกรอก: ความสูงตามบรรทัด ไม่ตัดสระไทย */
button,select,input{font:inherit;font-size:.9rem;line-height:1.35;color:var(--ink)}
button{background:var(--panel);border:1px solid var(--line);border-radius:.4rem;padding:.25rem .65rem;cursor:pointer;white-space:nowrap}
button[aria-pressed="true"],button[aria-selected="true"]{border-color:var(--main);box-shadow:inset 0 0 0 1px var(--main)}
button:disabled{opacity:.5;cursor:not-allowed}
select,input{background:transparent;border:1px solid var(--line);border-radius:.4rem;padding:.25rem .55rem;min-width:0}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,canvas:focus-visible{outline:2px solid var(--wan);outline-offset:2px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:.7rem;
  -webkit-backdrop-filter:blur(12px) saturate(140%);backdrop-filter:blur(12px) saturate(140%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 .5rem 1.5rem rgba(0,0,0,.18)}
.chips{display:flex;gap:.35rem;flex-wrap:wrap;align-items:center}
.chip{font-size:.85rem;line-height:1.35;padding:.1rem .5rem;border-radius:1rem;border:1px solid var(--line);white-space:nowrap}
.chip .i{font-weight:700;margin-right:.25rem}
.i.ok{color:var(--main)} .i.warn{color:var(--warn)} .i.down{color:var(--down)} .i.cut{color:var(--muted)} .i.maint{color:var(--planned)}
#fresh.stale{color:var(--down);border-color:var(--down)}

/* ===== เลย์เอาต์: กริดซ้อนบนภาพ 3D ===== */
#ui{position:absolute;inset:0;display:grid;pointer-events:none;
  grid-template-columns:minmax(10rem,14rem) minmax(0,1fr) minmax(16rem,22rem);
  grid-template-rows:auto minmax(0,1fr) auto;gap:.6rem;padding:.6rem;
  padding-top:calc(.6rem + env(safe-area-inset-top,0px));padding-bottom:calc(.6rem + env(safe-area-inset-bottom,0px))}
#ui>*{pointer-events:auto;min-width:0}
#top{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:.4rem .8rem;padding:.4rem .7rem}
#top h1{font-size:1.1rem;margin:0;font-weight:600;white-space:nowrap}
#bigNum{display:flex;align-items:baseline;gap:.35rem;border:none;background:transparent;box-shadow:none;padding:0 .2rem}
#bigNum b{font-size:1.8rem;line-height:1;font-weight:600;color:var(--main)}
#bigNum.hot b{color:var(--down)}
#bigNum span{font-size:.75rem;color:var(--ink-2);white-space:normal;max-width:4.5rem;line-height:1.2;text-align:left}
#search{flex:1 1 9rem;max-width:15rem}
.topbtns{margin-left:auto;display:flex;gap:.35rem;flex-wrap:wrap;justify-content:flex-end}
#leftcol{grid-column:1;grid-row:2;display:flex;flex-direction:column;gap:.6rem;min-height:0}
#left{flex:0 1 auto;min-height:0;overflow:auto;padding:.6rem}
#mini{flex:none;width:100%;aspect-ratio:1/1;height:auto;padding:0;cursor:crosshair}
#center{grid-column:2;grid-row:2;position:relative;pointer-events:none;min-height:0}
#right{grid-column:3;grid-row:2;align-self:start;max-height:100%;overflow:auto;padding:.6rem}
#bottom{grid-column:1/-1;grid-row:3;justify-self:center;display:flex;flex-wrap:wrap;align-items:center;gap:.3rem 1rem;padding:.3rem .8rem;font-size:.85rem;max-width:100%}
#bottom label{display:flex;align-items:center;gap:.3rem;cursor:pointer;white-space:nowrap}
#bottom input{accent-color:var(--main)}
#bottom details{position:relative}
#bottom summary{cursor:pointer;list-style:none;white-space:nowrap}
#fiberLegend{position:absolute;bottom:2rem;right:0;padding:.5rem .7rem;display:flex;flex-direction:column;gap:.2rem;white-space:nowrap;z-index:6}
.fl{display:inline-block;width:1.4rem;height:.25rem;border-radius:2px;margin-right:.5rem;vertical-align:middle}
.sw{width:.65rem;height:.65rem;border-radius:2px;display:inline-block}
#staleBar{position:absolute;top:0;left:50%;transform:translateX(-50%);max-width:calc(100% - 1rem);padding:.35rem .9rem;border-radius:.4rem;
  background:var(--down);color:#fff;font-size:.9rem;display:none;pointer-events:auto;text-align:center}
body.stale #staleBar{display:block}
body.stale canvas{filter:grayscale(.9) brightness(.75)}
#info{position:absolute;right:0;bottom:0;width:min(22rem,100%);max-height:100%;overflow:auto;padding:.7rem .9rem;display:none;pointer-events:auto;box-sizing:border-box}
#info.open{display:block}
#info h2{font-size:1.05rem;margin:0 0 .1rem;padding-right:3rem;line-height:1.35}
#info .sub{color:var(--ink-2);font-size:.85rem;margin:0 0 .5rem}
#info dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:.2rem .8rem;margin:0;font-size:.9rem}
#info dt{color:var(--ink-2)} #info dd{margin:0;overflow-wrap:anywhere}
#info .close{position:absolute;top:.5rem;right:.5rem}
#info .links{display:flex;gap:.35rem;flex-wrap:wrap;margin-top:.6rem}

/* แผงอาคาร / แจ้งเตือน */
.ptitle{font-size:.9rem;font-weight:600;margin:0 0 .4rem;display:flex;align-items:center;justify-content:space-between;gap:.5rem}
.pmin{padding:0 .5rem}
#left.collapsed>:not(.ptitle),#right.collapsed>:not(.rtabs){display:none}
.blist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.blist button{width:100%;text-align:left;display:flex;gap:.45rem;align-items:center;border-color:transparent;background:transparent;box-shadow:none;padding:.25rem .4rem;font-size:.9rem}
.blist button[aria-current="true"]{border-color:var(--main)}
.blist .n{margin-left:auto;font-size:.8rem;color:var(--ink-2)}
.floors{display:flex;flex-wrap:wrap;gap:.25rem;margin:.5rem 0 .25rem}
.floors button{padding:.1rem .5rem}
.back{margin-top:.4rem;width:100%}
.rtabs{display:flex;gap:.25rem;margin-bottom:.5rem}
.rtabs button[role=tab]{flex:1 1 0;padding:.2rem .3rem;font-size:.85rem;white-space:normal}
.inc{border:1px solid var(--line);border-left-width:4px;border-radius:.4rem;padding:.45rem .6rem;margin-bottom:.4rem;cursor:pointer}
.inc.down{border-left-color:var(--down)} .inc.warn{border-left-color:var(--warn)} .inc.maint{border-left-color:var(--planned);cursor:default}
.inc.cur{box-shadow:0 0 0 2px var(--wan)}
.inc h3{font-size:.9rem;margin:0;font-weight:600;line-height:1.4}
.inc p{margin:.1rem 0 0;font-size:.82rem;color:var(--ink-2);overflow-wrap:anywhere}
.inc .meta{display:flex;gap:.6rem;flex-wrap:wrap;font-size:.78rem;color:var(--ink-2);margin-top:.2rem}
.inc .ack{font-size:.78rem;margin-top:.35rem;color:var(--main)}
.ackform{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.35rem}
.ackform input{flex:1 1 7rem}
.empty,.hnote{font-size:.82rem;color:var(--ink-2);margin:0 0 .4rem}
.sub2{font-size:.85rem;color:var(--ink-2);margin:.8rem 0 .35rem;font-weight:600}
.hrow{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:.4rem;padding:.35rem .1rem;border-bottom:1px solid var(--line);font-size:.82rem;cursor:pointer}
.hrow .tm{color:var(--ink-2)}
.hrow .tx small{display:block;color:var(--ink-2)}
.hrow .live{color:var(--down);font-weight:600}
.urow{border:1px dashed var(--line);border-radius:.4rem;padding:.4rem .55rem;margin-bottom:.35rem;font-size:.82rem}
.urow b{font-weight:600} .urow small{display:block;color:var(--ink-2)}
.labs{margin-top:.6rem}
.labrow{display:block;width:100%;text-align:left;border-color:transparent;background:transparent;box-shadow:none;padding:.2rem .4rem;font-size:.82rem;white-space:normal}
.bar{display:block;height:.3rem;border-radius:3px;background:var(--line);margin-top:.2rem;overflow:hidden}
.bar i{display:block;height:100%;background:var(--lab)}
#sheet{display:none}

/* โหมดทีวี */
body.tv #leftcol>#left,body.tv #bottom{display:none}
body.tv #ui{grid-template-columns:minmax(10rem,14rem) minmax(0,1fr) minmax(18rem,26rem)}

/* จอกลาง: ย่อคอลัมน์ ซ่อนปุ่มรอง */
@media (max-width:1180px){ #ui{grid-template-columns:minmax(9rem,12rem) minmax(0,1fr) minmax(15rem,19rem)} .topbtns .wide{display:none} }
@media (max-height:720px){ #mini{display:none} }

/* มือถือ/แท็บเล็ตแนวตั้ง */
@media (max-width:900px){
  #ui{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;gap:.4rem;padding:.4rem}
  #top{padding:.35rem .5rem;gap:.35rem .5rem}
  #search,#leftcol,#right,#bottom,.topbtns .wide{display:none}
  #bigNum span{display:none}
  #center{grid-column:1}
  #sheet{display:flex;flex-direction:column;grid-column:1;grid-row:3;height:40vh;padding:.5rem .6rem}
  #sheet.min{height:auto}
  #sheet.min .tabbody{display:none}
  .tabs{display:flex;gap:.3rem;margin-bottom:.4rem}
  .tabs button[role=tab]{flex:1 1 0;padding:.25rem .2rem;font-size:.85rem}
  .tabbody{overflow:auto;flex:1;min-height:0}
  #msearch{width:100%;box-sizing:border-box;font-size:1rem;padding:.45rem .6rem}
  #info{width:100%;max-height:60%}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }

@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){--warn:#8a5a00} }
:root[data-theme="light"]{--warn:#8a5a00}
.wanchip{background:transparent;box-shadow:none;cursor:pointer}
.stlegend{display:flex;gap:.25rem .5rem;flex-wrap:wrap;align-items:center;color:var(--ink-2);white-space:nowrap}
.stlegend .i{margin-left:.35rem}
#toast{position:absolute;top:3rem;left:50%;transform:translateX(-50%);max-width:calc(100% - 1rem);padding:.4rem .9rem;border-radius:.4rem;
  background:var(--ink);color:var(--bg);font-size:.9rem;opacity:0;transition:opacity .25s;pointer-events:none;text-align:center}
#toast.show{opacity:.95}
#hint{position:absolute;left:0;bottom:0;padding:.35rem .7rem;font-size:.82rem;color:var(--ink-2);pointer-events:auto;transition:opacity .6s}
#hint.gone{opacity:0;pointer-events:none}
#help{position:absolute;grid-column:1/-1;grid-row:1/-1;justify-self:center;align-self:center;width:min(40rem,calc(100% - 1rem));max-height:calc(100% - 2rem);overflow:auto;padding:1rem 1.2rem;z-index:20}
#help h2{font-size:1.15rem;margin:0 0 .6rem}
#help h3{font-size:.95rem;margin:1rem 0 .35rem}
#help table{border-collapse:collapse;width:100%;font-size:.88rem}
#help td{padding:.2rem .4rem;vertical-align:top;border-bottom:1px solid var(--line)}
#help td:first-child{white-space:nowrap;width:1%}
#help .close{position:absolute;top:.7rem;right:.7rem}
#help kbd{border:1px solid var(--line);border-radius:.25rem;padding:0 .35rem;font-family:inherit;font-size:.82rem}
#help .row{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:1rem}
#tour{position:absolute;inset:0;z-index:30;pointer-events:none}
#tourBox{position:absolute;width:min(20rem,calc(100% - 1rem));padding:.8rem 1rem;pointer-events:auto}
#tourBox h3{font-size:1rem;margin:0 0 .3rem}
#tourBox p{font-size:.9rem;margin:0 0 .6rem}
#tourBox .row{display:flex;gap:.4rem;justify-content:space-between;align-items:center}
#tourBox .step{font-size:.8rem;color:var(--ink-2)}
.tourOn{outline:3px solid var(--wan)!important;outline-offset:3px;border-radius:.6rem}
.shape{display:inline-block;vertical-align:middle;margin-right:.3rem}
.inc:focus-visible{outline:2px solid var(--wan);outline-offset:2px}
body.tv #info dl>:nth-child(n+9){display:none}
body.tv #info .links{display:none}
@media (max-width:900px){ .stlegend{display:none} #hint{bottom:auto;top:0} }

#miniBox{flex:none;margin:0;padding:.45rem .55rem .4rem}
#miniBox figcaption{font-size:.85rem;font-weight:600;display:flex;justify-content:space-between;align-items:baseline;gap:.4rem;margin-bottom:.25rem}
#miniBox figcaption small{font-weight:400;color:var(--ink-2);font-size:.75rem}
#mini{width:100%;aspect-ratio:1/1;height:auto;display:block;cursor:crosshair;border-radius:.4rem;background:transparent;border:0;box-shadow:none;padding:0}
.mlegend{display:flex;gap:.7rem;flex-wrap:wrap;margin:.3rem 0 0;font-size:.75rem;color:var(--ink-2)}
.mlegend span{display:inline-flex;align-items:center;gap:.25rem}
.mlegend .view{display:inline-block;width:.9rem;height:.6rem;border:1.5px solid var(--wan);background:color-mix(in srgb,var(--wan) 20%,transparent);border-radius:2px}
@media (max-height:720px){ #miniBox{display:none} }
body.tv #leftcol>#miniBox{display:block}

*,*::before,*::after{box-sizing:border-box}
#ui{overflow:hidden}
#ui>*,.panel{max-width:100%}
.sbox{position:relative;flex:1 1 11rem;max-width:18rem;min-width:8rem}
.sbox #search{width:100%;max-width:none}
#sres{position:absolute;top:calc(100% + .35rem);left:0;width:min(26rem,calc(100vw - 2rem));max-height:min(28rem,70vh);overflow:auto;padding:.4rem;z-index:40}
#mres{margin-top:.4rem}
.sgh{font-size:.75rem;color:var(--ink-2);margin:.5rem .3rem .2rem;font-weight:600}
.sq{display:flex;flex-wrap:wrap;gap:.3rem;padding:0 .2rem}
.sq button{padding:.15rem .6rem;font-size:.82rem}
.shelp{font-size:.82rem;color:var(--ink-2);margin:.5rem .3rem}
.shead{display:flex;justify-content:space-between;align-items:center;gap:.5rem;font-size:.8rem;color:var(--ink-2);padding:.1rem .3rem .3rem}
.sr{display:flex;gap:.5rem;align-items:flex-start;padding:.35rem .45rem;border-radius:.35rem;cursor:pointer}
.sr .i{margin-top:.1rem}
.sr b{display:block;font-weight:600;font-size:.88rem}
.sr small{display:block;color:var(--ink-2);font-size:.78rem;overflow-wrap:anywhere}
.sr.on,.sr:hover{background:color-mix(in srgb,var(--wan) 16%,transparent)}
#hlBar{position:absolute;top:0;left:50%;transform:translateX(-50%);padding:.3rem .5rem .3rem .8rem;font-size:.85rem;display:flex;gap:.6rem;align-items:center;pointer-events:auto;white-space:nowrap;max-width:calc(100% - 1rem);overflow:hidden;text-overflow:ellipsis}
#hlBar[hidden]{display:none}
body.stale #hlBar{top:2.6rem}
#info dd,#info h2,.inc h3,.inc p{overflow-wrap:anywhere}
@media (max-width:900px){
  #sheet,#info{width:100%}
  .tabs{min-width:0}
  .tabs button[role=tab]{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #sheetMin{flex:0 0 auto}
}

/* กันข้อความเลยขอบ */
.blabel{max-width:14rem;overflow:hidden;text-overflow:ellipsis}
.badge{max-width:16rem;overflow:hidden;text-overflow:ellipsis}
.chip{max-width:100%;overflow:hidden;text-overflow:ellipsis}
#top h1{white-space:normal;min-width:0}
#top>*{min-width:0}
.topbtns{min-width:0;max-width:100%}
#scenario{max-width:14rem;text-overflow:ellipsis}
button{max-width:100%;overflow:hidden;text-overflow:ellipsis}
.ackform button{white-space:normal}
.blist button{white-space:normal;text-align:left}
.stlegend{white-space:normal}
.stlegend .i{white-space:nowrap}
#fiberLegend{max-width:calc(100vw - 2rem);white-space:normal}
#fiberLegend span{display:block}
#hint{max-width:calc(100% - .5rem)}
#sres{left:auto;right:auto}
.sr span{min-width:0}
#tourBox p,#tourBox h3,#help td{overflow-wrap:anywhere}
.hrow .tx{min-width:0;overflow-wrap:anywhere}
.inc .meta span{overflow-wrap:anywhere}

.chip.demo{background:color-mix(in srgb,var(--warn) 18%,transparent);border-color:var(--warn);color:var(--ink);font-weight:600;cursor:pointer}
.demonote{font-size:.78rem;color:var(--ink-2);margin:0 0 .45rem;padding:.3rem .5rem;border:1px dashed var(--warn);border-radius:.35rem}
</style>
</head>
<body>
<div id="app">
  <div id="labels"></div>
  <div id="ui">
    <div id="top" class="panel" role="banner">
      <h1>SB School NOC</h1>
      <button id="bigNum" title="เหตุที่ยังไม่มีคนรับเรื่อง"><b>0</b><span>ยังไม่มีคนรับ</span></button>
      <div class="sbox"><input id="search" type="search" role="combobox" aria-expanded="false" aria-controls="sres" aria-autocomplete="list" autocomplete="off"
        placeholder="ค้นหา ตึก ชั้น อุปกรณ์ IP ( / )" aria-label="ค้นหา"><div id="sres" class="panel" role="listbox" hidden></div></div>
      <div class="chips" id="chips" aria-live="polite"></div>

function routeAlong(a,b,rot,k){
  const c=Math.cos(rot), s=Math.sin(rot);
  const toF=p=>[p.x*c+p.z*s, -p.x*s+p.z*c];
  const fromF=(x,z,y)=>new THREE.Vector3(x*c-z*s,y,x*s+z*c);
  const y=0.25+(k%5)*0.12, off=((k%5)-2)*0.35;
  const [ax,az]=toF(a), [bx,bz]=toF(b);
  const P=[a, fromF(ax,az,y), fromF(ax+off,az,y), fromF(ax+off,bz+off,y), fromF(bx,bz+off,y), fromF(bx,bz,y), b];
  const path=new THREE.CurvePath();
  for(let i=0;i<P.length-1;i++) if(P[i].distanceToSquared(P[i+1])>1e-6) path.add(new THREE.LineCurve3(P[i],P[i+1]));
  return path;
}
// เดินสาย: ออกจากขอบอาคารต้นทาง → วิ่งในช่องทางเดินขนานขอบตึก → เข้าขอบอาคารปลายทาง → ขึ้นชั้น
function frameOf(bl){ const c=Math.cos(bl.rot), s=Math.sin(bl.rot);
  return {toF:p=>[p.x*c+p.z*s,-p.x*s+p.z*c], fromF:(x,z,y)=>new THREE.Vector3(x*c-z*s,y,x*s+z*c),
          e1:[c,s], e2:[-s,c], ctr:[bl.at[0]*c+bl.at[1]*s,-bl.at[0]*s+bl.at[1]*c]}; }
function edgeExit(bl,p,toward,gap,y,force){ // จุดนอกขอบอาคาร bl ด้านที่หันไปหา toward
  const F=frameOf(bl); const [px,pz]=F.toF(p), [tx,tz]=F.toF(toward), [cx,cz]=F.ctr;
  const alongZ=force?force==='side':Math.abs(tz-cz)/bl.d >= Math.abs(tx-cx)/bl.w;
  if(alongZ) return {pt:F.fromF(px,cz+Math.sign(tz-cz)*(bl.d/2+gap),y), dir:F.e1};
  return {pt:F.fromF(cx+Math.sign(tx-cx)*(bl.w/2+gap),pz,y), dir:F.e2};
}
function routeEdge(a,b,src,tgt,k,isFiber,hint){
  const y=isFiber?0.5+(k%4)*0.18:0.2+(k%5)*0.1;
  const A0=new THREE.Vector3(a.x,y,a.z), B0=new THREE.Vector3(b.x,y,b.z);
  const S=edgeExit(src,a,b,hint==='end'?1.6:0.7+(k%4)*0.35,y,hint==='end'?'end':null), T=edgeExit(tgt,b,a,0.7,y);
  // จุดตัดของแนวช่องทางเดินสองเส้น
  const d1=S.dir,d2=T.dir, cr=d1[0]*d2[1]-d1[1]*d2[0];
  let C;
  const dx=T.pt.x-S.pt.x, dz=T.pt.z-S.pt.z;
  if(Math.abs(cr)>0.2){ const t=(dx*d2[1]-dz*d2[0])/cr; C=new THREE.Vector3(S.pt.x+d1[0]*t,y,S.pt.z+d1[1]*t); }
  else { const t=dx*d1[0]+dz*d1[1]; C=new THREE.Vector3(S.pt.x+d1[0]*t,y,S.pt.z+d1[1]*t); }
  const P=[a,A0,S.pt,C,T.pt,B0,b];
  const path=new THREE.CurvePath();
  for(let i=0;i<P.length-1;i++) if(P[i].distanceToSquared(P[i+1])>1e-6) path.add(new THREE.LineCurve3(P[i],P[i+1]));
  return path;
}
// ช่องทางเดินใต้อาคาร 2: ออกจากห้อง server ลงช่องทางเดิน วิ่งขนานอาคาร 2 แล้วลงตรงเข้าแถวตึกด้านใต้
function routeCorridor(a,b,k){
  const src=B.b2, F=frameOf(src); const y=0.5+k*0.18;
  const [ax,az]=F.toF(a), [cx,cz]=F.ctr; const zc=cz+src.d/2+1.8+k*0.45;
  const P1=F.fromF(ax,zc,y);
  // จุดบนแนวช่องทางเดินที่ x ตรงกับอุปกรณ์ปลายทาง
  const t=(b.x-P1.x)/F.e1[0]; const P2=new THREE.Vector3(b.x,y,P1.z+F.e1[1]*t);
  const P=[a,new THREE.Vector3(a.x,y,a.z),P1,P2,new THREE.Vector3(b.x,y,b.z),b];
  const path=new THREE.CurvePath();
  for(let i=0;i<P.length-1;i++) if(P[i].distanceToSquared(P[i+1])>1e-6) path.add(new THREE.LineCurve3(P[i],P[i+1]));
  return path;
}

// โซน ICET: อ้อมปลายตึกด้านตะวันออก (ไม่ผ่านอาคาร 1) วิ่งขึ้นเหนือ แล้วเลี้ยวเข้าในช่องว่างหน้าตึกปลายทาง
function routeNorth(a,b,tgt,k){
  // ออกจากห้อง server ทางด้านเหนือทันที (ไม่วิ่งผ่านสายโซนใต้) แล้วเรียงเลน: อาคาร 1 ในสุด → ICET1 → ICET2 → อาคารกีฬา นอกสุด
  const F=frameOf(B.b2), cen=id=>F.toF(new THREE.Vector3(B[id].at[0],0,B[id].at[1]));
  const line=['b1','b2','i1','i2'];
  const edge=Math.max(...line.map(id=>cen(id)[0]+B[id].w/2));
  const y=0.5+k*0.15, clearX=edge+2.6+k*0.55;
  const [ax,az]=F.toF(a), [bx,bz]=F.toF(b);
  const axk=ax+(k-1.5)*0.35;
  const b2N=cen('b2')[1]-B.b2.d/2;

  if(tgt.id==='b1'){
    const zg=cen('b1')[1]+B.b1.d/2+0.75;
    P=[a,F.fromF(ax,az,y),F.fromF(axk,az,y),F.fromF(axk,zg,y),F.fromF(bx,zg,y),F.fromF(bx,bz,y),b];
  } else {
    const zt=b2N-0.6-(3-k)*0.3;
    const head=[a,F.fromF(ax,az,y),F.fromF(axk,az,y),F.fromF(axk,zt,y),F.fromF(clearX,zt,y)];
    if(['sp','i2'].includes(tgt.id)){
      const back=Math.min(...['i2','sp'].map(id=>cen(id)[1]-B[id].d/2))-3.0-k*0.55;
      P=[...head,F.fromF(clearX,back,y),F.fromF(bx,back,y),F.fromF(bx,bz,y),b];
    } else P=[...head,F.fromF(clearX,bz,y),F.fromF(bx,bz,y),b];
  }
  const path=new THREE.CurvePath();
  for(let i=0;i<P.length-1;i++) if(P[i].distanceToSquared(P[i+1])>1e-6) path.add(new THREE.LineCurve3(P[i],P[i+1]));
  return path;
}
function routeAWest(a,b){

  const y=0.5, x0=a.x-0.5, zc=rowN-2.2;
  const gx=((B.s8.at[0]+B.s8.w/2)+(B.ba.at[0]-B.ba.w/2))/2;
  const P=[a,new THREE.Vector3(a.x,y,a.z),new THREE.Vector3(x0,y,a.z),new THREE.Vector3(x0,y,zc),

const ray=new THREE.Raycaster(), mouse=new THREE.Vector2(); let downAt=null;
renderer.domElement.addEventListener('pointerdown',e=>{downAt=[e.clientX,e.clientY];});
renderer.domElement.addEventListener('pointerup',e=>{
  if(!downAt||Math.hypot(e.clientX-downAt[0],e.clientY-downAt[1])>6) return;
  const r=renderer.domElement.getBoundingClientRect();
  mouse.set(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(mouse,camera);
  const hit=ray.intersectObjects(pickables.filter(m=>m.visible))[0];
  if(hit){ showInfo(hit.object.userData.isAP?AP_LIST[hit.instanceId].id:hit.object.userData.id); return; }
  let best=null, bd=e.pointerType==='touch'?32:20; const pv=new THREE.Vector3();
  DEV.forEach(d=>{ if(!d.mesh.visible) return; pv.copy(d.pos).project(camera); if(pv.z>1) return;
    const dx=(pv.x+1)/2*r.width-(e.clientX-r.left), dy=(1-pv.y)/2*r.height-(e.clientY-r.top), dd=Math.hypot(dx,dy);
    if(dd<bd){ bd=dd; best=d; } });
  if(best) showInfo(best.id);
});

const N=s=>(s||'').toString().toLowerCase().replace(/[\s·()\-_,]+/g,'').replace(/ฯ/g,'');

function buildIndex(){
  const idx=[];
  BLD.filter(b=>!b.area).forEach(b=>{ const bw=N(b.name+' '+B_ALIAS[b.id]);
    idx.push({kind:'b',id:b.id,b:b.id,label:b.name,sub:`${b.floors} ชั้น`,text:bw+'อาคารตึก',bw});
    for(let f=1;f<=b.floors;f++) idx.push({kind:'f',id:b.id+'#'+f,b:b.id,f,label:`${b.name} ชั้น ${f}`,sub:'เลือกชั้น',text:bw+'ชั้น'+f,bw}); });
  DEV.forEach(d=>{ const bw=d.b?N(B[d.b].name+' '+B_ALIAS[d.b]):'';
    idx.push({kind:'d',id:d.id,b:d.b,f:d.f,d,label:d.type==='wan'?'อินเทอร์เน็ต '+d.name:d.name,bw,
      text:N([d.name,d.ip,d.model,d.vlan?'vlan'+d.vlan:'',d.role,T_WORD[d.type],d.f?'ชั้น'+d.f:''].join(' '))+bw}); });
  return idx;

let SIDX=null;
function tokMatch(e,t){
  if(/^[ab]$/.test(t)) return e.b===(t==='a'?'ba':'bb');
  if(/^\d{1,3}$/.test(t)) return e.f===+t||(e.bw||'').includes(t)||e.text.includes('vlan'+t);
  const st=e.kind==='d'?stateOf(e.d.id):null;
  if(st&&N(S_WORD[st]).includes(t)) return true;
  return e.text.includes(t)||(e.d&&e.d.ip&&e.d.ip.startsWith(t));
}
function runSearch(q){
  SIDX=SIDX||buildIndex();
  const toks=q.trim().toLowerCase().split(/\s+/).filter(Boolean).map(N).filter(Boolean);
  if(!toks.length) return [];
  const res=SIDX.filter(e=>toks.every(t=>tokMatch(e,t))).map(e=>{ let sc=0; const nq=N(q);
    if(e.d&&e.d.ip===q.trim()) sc+=100; if(N(e.label).startsWith(nq)) sc+=40; if(N(e.label)===nq) sc+=40;
    sc+=e.kind==='b'?30:e.kind==='f'?15:0;
    if(e.d){ const st=stateOf(e.d.id); if(st==='down') sc+=6; if(st==='warn') sc+=4; if(['main','core'].includes(e.d.type)) sc+=3; }
    return {e,sc}; });
  const G={b:0,f:1,d:2}; return res.sort((a,b)=>(G[a.e.kind]-G[b.e.kind])||(b.sc-a.sc)).map(r=>r.e);
}

function wireSearch(input,box,popup){
  let list=[], sel=-1;
  const open=()=>{ if(popup){ box.hidden=false; input.setAttribute('aria-expanded','true');
    const r=input.getBoundingClientRect(), bw=box.offsetWidth, vw=document.documentElement.clientWidth;
    box.style.left=Math.min(0,vw-8-(r.left+bw))+'px'; } };
  const close=()=>{ if(popup){ box.hidden=true; input.setAttribute('aria-expanded','false'); } };
  const refresh=()=>{ list=runSearch(input.value); sel=list.length?0:-1; renderResults(box,input.value,list,sel); open();
    input.setAttribute('aria-activedescendant',sel>=0?box.id+'-'+sel:''); };
  const choose=i=>{ const e=list[i]; if(!e) return; saveRecent(input.value.trim()); pick(e); close(); if(popup) input.blur(); };
  input.addEventListener('input',refresh); input.addEventListener('focus',refresh);

const v=new THREE.Vector3(); let last=performance.now();
function tick(now){
  const dt=Math.min((now-last)/1000,0.1); last=now;
  if(fly){ fly.k=Math.min(1,fly.k+(reduce?1:dt*(fly.spd||1.4))); const e=1-Math.pow(1-fly.k,3);
    camera.position.lerpVectors(fly.p0,fly.p1,e); controls.target.lerpVectors(fly.t0,fly.t1,e); if(fly.k>=1) fly=null; }
  controls.update();
  if(!reduce) links.forEach(l=>l.dots.forEach(s=>{ if(s.userData.stop){ s.visible=false; (s.userData.tail||[]).forEach(t=>t.visible=false); return; }
    s.visible=l.line.visible; s.userData.t=((s.userData.t+dt*l.speed*(l.st==='warn'?0.3:1)*(s.userData.dir||1))%1+1)%1; s.position.copy(l.curve.getPoint(s.userData.t));
    if(s.userData.tail){ const on=!eco&&s.visible; s.userData.tail.forEach(m=>{ m.visible=on;
      if(on){ let tt=s.userData.t-(s.userData.dir||1)*m.userData.j*0.5/l.len; tt=((tt%1)+1)%1; m.position.copy(l.curve.getPoint(tt)); } }); } }));
  animateFx(now); drawMini(now); syncAP(); syncAPL(); syncTails();
  incidents.forEach(i=>{ const k=i.sev==='down'?0.35+0.65*Math.abs(Math.sin(now/300)):0.35+0.4*Math.abs(Math.sin(now/700));
    i.d.mesh.material.emissiveIntensity=reduce?0.8:k; });
  renderFrame();
  const W=app.clientWidth,Hh=app.clientHeight;
  // ป้ายชื่อหลบกัน: ตึกที่มีปัญหาก่อน → ตึก → ISP → พื้นที่โล่ง
  const placed=[];
  labelEls.map(x=>{ v.copy(x.pos).project(camera); const b=BLD.find(bb=>bb.label===x.el);
    const pr=b?(b.area?3:(bStatusCache[b.id]&&bStatusCache[b.id]!=='ok'?0:1)):2;
    return {x,sx:(v.x+1)/2*W,sy:(1-v.y)/2*Hh,off:v.z>1,pr}; }).sort((a,b)=>a.pr-b.pr).forEach(o=>{
    const w=o.x.w||(o.x.w=o.x.el.offsetWidth||80), h=o.x.h||(o.x.h=o.x.el.offsetHeight||20);
    const up=(o.x.el.style.transform||'').indexOf('0)')<0; const rect=[o.sx-w/2,up?o.sy-h:o.sy,w,h];
    const hit=placed.some(p=>rect[0]<p[0]+p[2]+4&&rect[0]+rect[2]+4>p[0]&&rect[1]<p[1]+p[3]+2&&rect[1]+rect[3]+2>p[1]);
    const show=!o.off&&!hit; o.x.el.style.visibility=show?'visible':'hidden';
    if(show){ placed.push(rect); o.x.el.style.left=Math.max(w/2+4,Math.min(W-w/2-4,o.sx))+'px'; o.x.el.style.top=Math.max(up?h+4:4,Math.min(Hh-4,o.sy))+'px'; } });
  fpsWatch(now);
  incidents.forEach(i=>{ const el=badges[i.d.id]; if(!el) return; v.copy(i.d.pos); v.y+=1.3; v.project(camera);
    el.style.display=(v.z>1||!i.d.mesh.visible)?'none':'block'; const bw=el.offsetWidth||90;
    el.style.left=Math.max(bw/2+4,Math.min(W-bw/2-4,(v.x+1)/2*W))+'px'; el.style.top=Math.max(24,Math.min(Hh-4,(1-v.y)/2*Hh))+'px'; });
  requestAnimationFrame(tick);
}
